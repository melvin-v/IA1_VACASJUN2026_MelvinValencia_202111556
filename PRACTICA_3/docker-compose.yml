services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: smartinvoice
      POSTGRES_PASSWORD: smartinvoice
      POSTGRES_DB: smartinvoice
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartinvoice"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/code/uploads

volumes:
  pgdata:
